name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test ./... -race -count=1
      - name: Numeric verification suite
        run: go test ./internal/verification/ -race -count=1 -v
